<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta name="author" content="BuffNook">
<meta name="theme-color" content="#1B1714">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26' font-family='ui-monospace,monospace' font-weight='800'>B</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{CSS_PATH}}">

<!-- Open Graph -->
<meta property="og:type" content="{{OG_TYPE}}">
<meta property="og:site_name" content="BuffNook Tower">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
{{#OG_IMAGE}}<meta property="og:image" content="{{OG_IMAGE}}">{{/OG_IMAGE}}

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
{{#OG_IMAGE}}<meta name="twitter:image" content="{{OG_IMAGE}}">{{/OG_IMAGE}}

{{JSONLD}}
</head>

<body data-slug="{{SLUG}}" data-i18n-title="{{TITLE_I18N}}">

<nav class="nav" aria-label="Primary">
  <a class="nav-brand" href="{{HOME_LINK}}"><img src="{{HOME_LINK}}assets/img/logo.png" alt="BuffNook Tower" loading="lazy"></a>
  <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
  <label class="nav-burger" for="nav-toggle" aria-hidden="true"><span></span><span></span></label>
  <div class="nav-links">
    <a href="{{ABOUT_LINK}}" data-i18n="nav.about">About</a>
    <button class="nav-lang" id="site-lang" type="button" aria-label="Switch language">中文</button>
  </div>
</nav>

<main>
{{#H1}}<header class="page-h1"><h1 data-i18n="{{H1_I18N}}">{{H1}}</h1></header>{{/H1}}
{{BODY}}
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <span>BuffNook <b>Tower</b></span>
      <small>&copy; 2026 BuffNook</small>
    </div>
    <nav class="footer-links" aria-label="Legal">
      <a href="{{ABOUT_LINK}}" data-i18n="footer.about">About</a>
      <a href="{{CONTACT_LINK}}" data-i18n="footer.contact">Contact</a>
      <a href="{{PRIVACY_LINK}}" data-i18n="footer.privacy">Privacy</a>
      <a href="{{TERMS_LINK}}" data-i18n="footer.terms">Terms</a>
      <a href="{{DISCLAIMER_LINK}}" data-i18n="footer.disclaimer">Disclaimer</a>
    </nav>
  </div>
</footer>

<script src="{{JS_PATH}}" defer></script>
</body>
</html>
