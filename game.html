<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuffNook Tower · Free Physics Stacking Game</title>
<meta name="description" content="BuffNook Tower — stack 12 blocks, survive the seesaw, decide when to bank. Free browser game, plays on desktop and mobile.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://buffnook.com/game.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26' font-family='ui-monospace,monospace' font-weight='800'>B</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-slug="buffnook-tower">

<!-- 顶导航 -->
<nav class="nav">
  <a class="nav-brand" href="index.html"><img src="assets/img/logo.png" alt="BuffNook Tower" loading="lazy">
  <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
  <label class="nav-burger" for="nav-toggle" aria-hidden="true"><span></span><span></span></label>
  <div class="nav-links">
    <a href="games/index.html" data-i18n="nav.games">Games</a>
    <a href="blog/index.html" data-i18n="nav.blog">Blog</a>
    <a href="about.html" data-i18n="nav.about">About</a>
    <button class="nav-lang" id="site-lang" type="button" aria-label="Switch language">中文</button>
  </div>
</nav>

<!-- 游戏容器 -->
<main>
  <section class="game-wrap">
    <div class="game-head">
      <h1>BuffNook Tower</h1>
      <p>Free physics stacking game · 12 blocks · 5 buffs · desktop & mobile playable</p>
    </div>

    <div class="game-stage game-stage--loading" data-slug="buffnook-tower">
      <div class="game-loader" aria-hidden="true">
        <div class="spinner"></div>
        <div class="loader-text">Loading…</div>
      </div>
      <iframe
        src="embed/buffnook-tower/index.html"
        title="BuffNook Tower game"
        loading="eager"
        allow="fullscreen; clipboard-write"
        referrerpolicy="no-referrer"></iframe>
    </div>

    <!-- 一排按钮 -->
    <div class="game-bar">
      <button data-action="like">
        <span class="icon">♡</span><span>Like</span>
        <span class="like-count">0</span>
      </button>
      <button data-action="share">
        <span class="icon">⇪</span><span>Share</span>
      </button>
      <button data-action="fullscreen">
        <span class="icon">⤢</span><span>Fullscreen</span>
      </button>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <span>BuffNook <b>Tower</b></span>
      <small>© 2026 Buffnook</small>
    </div>
    <nav class="footer-links" aria-label="Legal">
      <a href="about.html" data-i18n="nav.about">About</a>
      <a href="contact.html" data-i18n="footer.contact">Contact</a>
      <a href="privacy.html" data-i18n="footer.privacy">Privacy</a>
      <a href="terms.html" data-i18n="footer.terms">Terms</a>
    </nav>
  </div>
</footer>

<script src="assets/js/app.js" defer></script>
</body>
</html>
